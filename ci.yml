name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The repo ships a .oxlintrc.json, so lint with Oxlint using that config
      - name: Lint
        run: npx --no-install oxlint -c .oxlintrc.json src

      - name: Type-check
        run: npx --no-install tsc -p tsconfig.app.json --noEmit

      # Uses the project's own build script (Vite) if it defines one
      - name: Build
        run: npm run build --if-present

      - name: Upload production build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: ecosnap-dist
          path: dist
          if-no-files-found: ignore
          retention-days: 7

  website:
    name: Check static website folder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify website files and JS syntax
        run: |
          if [ -d website ]; then
            test -f website/index.html
            node --check website/js/app.js
            node --check website/js/data.js
            echo "website/ OK"
          else
            echo "No website/ folder, skipping."
          fi
